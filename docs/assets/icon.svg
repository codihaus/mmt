<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2540"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa6ff"/>
      <stop offset="1" stop-color="#3d6be0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- macOS icon grid: 824 px tile with 100 px margin -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- chat bubble with a tail at the bottom left -->
  <path d="M300 250 H724 A96 96 0 0 1 820 346 V598 A96 96 0 0 1 724 694 H430 L322 786 L340 694 H300 A96 96 0 0 1 204 598 V346 A96 96 0 0 1 300 250 Z"
        fill="url(#bubble)"/>
  <path d="M300 250 H724 A96 96 0 0 1 820 346 V598 A96 96 0 0 1 724 694 H300 A96 96 0 0 1 204 598 V346 A96 96 0 0 1 300 250 Z" fill="url(#gloss)"/>

  <!-- terminal prompt -->
  <g filter="url(#glow)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="54">
    <path d="M344 384 L452 472 L344 560"/>
    <path d="M512 562 H680"/>
  </g>
</svg>
